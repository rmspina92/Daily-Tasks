<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Day</title>
<meta name="theme-color" id="metaTheme" content="#F4F1EA">
<script>try{var __s=JSON.parse(localStorage.getItem('meu-dia-v1')||'null');if(__s&&__s.settings&&__s.settings.dark===true)document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EA; --panel:#FFFFFF; --ink:#1E2230; --muted:#707482;
  --line:#E4DFD3; --line2:#EFEBE1; --red:#E5484D; --hour:52px;
  --shadow:0 1px 2px rgba(30,34,48,.06),0 4px 14px rgba(30,34,48,.05);
  --sidew:292px; --railw:46px; --gridw:600px; --gap:16px; --pad:20px;
  --wrap:calc(var(--sidew) + var(--gap) + var(--gridw) + var(--pad) * 2);
  /* theme colors (light) */
  --panel2:#FFFFFF; --hover:#F0ECE3; --hover2:#F8F5EE; --line3:#D8D2C3; --dash:#CFC8B7;
  --fill:#1E2230; --fill-h:#343A50; --fill-fg:#FFFFFF; --fill-sub:#B9BDCC;
  --dng:#B42318; --dng-line:#F3C7C3; --faint:#B3AD9F; --lift:rgba(30,34,48,.28);
  --drop-bg:#EAF2FF; --drop-sel:#2B3350; --input:#FFFFFF; --chipbg:#F6F3EC;
  --daysel:#F1EEE6; --daysel-line:#CFC8B7; --toast-bg:#1E2230; --toast-fg:#FFFFFF;
  --ov:rgba(30,34,48,.42); --focus:#3B82F6;
}
/* ---------- Night mode: soft blue-charcoal (a notch lighter), warm off-white text, deep block tones ---------- */
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1D202A; --panel:#272B37; --panel2:#313644; --ink:#E6E4DE; --muted:#A3A7B6;
  --line:#3A3F4E; --line2:#2F3441; --red:#F2737A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.22);
  --hover:#343947; --hover2:#2E3341; --line3:#474D60; --dash:#4A5064;
  --fill:#DCD9D1; --fill-h:#ECE9E1; --fill-fg:#171A21; --fill-sub:#4F5363;
  --dng:#F59A94; --dng-line:#66393B; --faint:#7B8090; --lift:rgba(255,255,255,.32);
  --drop-bg:#27365A; --drop-sel:#3D4C82; --input:#202430; --chipbg:#383D4D;
  --daysel:#343A4C; --daysel-line:#555C74; --toast-bg:#394055; --toast-fg:#E8E6E0;
  --ov:rgba(8,9,14,.62); --focus:#8DBBFF;
}
/* on the deeper block colors, hover/overlay tints go light instead of dark */
html[data-theme="dark"] .ev[data-zone="top"] .h.top,html[data-theme="dark"] .ev[data-zone="bottom"] .h.bottom{background:rgba(255,255,255,.22)}
html[data-theme="dark"] .ev .bell:hover,html[data-theme="dark"] .tcard .edit:hover{background:rgba(255,255,255,.16)}
html[data-theme="dark"] .prow em{background:rgba(255,255,255,.2)}
body.side-off{--wrap:calc(var(--railw) + var(--gap) + var(--gridw) + var(--pad) * 2)}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- Top bar ---------- */
.top{display:flex;align-items:center;gap:20px;padding:14px var(--pad) 10px;flex-wrap:wrap;width:100%;max-width:var(--wrap);margin-left:auto;margin-right:auto}
.top .left{min-width:220px;flex:1}
.top h1{margin:0;font-size:24px;letter-spacing:-.02em;font-weight:700}
.top .sub{color:var(--muted);margin-top:2px;font-size:13px}
.nav{display:flex;align-items:center;gap:6px;background:var(--panel);padding:4px;border-radius:12px;box-shadow:var(--shadow)}
.nav button,.nav input{border:0;background:transparent;border-radius:8px;padding:7px 11px;font-weight:500}
.nav button:hover{background:var(--hover)}
.nav .today{background:var(--fill);color:var(--fill-fg)}
.nav .today:hover{background:var(--fill-h)}
.nav input[type=date]{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:10px;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{background:var(--hover2);border-color:var(--line3)}
.btn.primary{background:var(--fill);color:var(--fill-fg);border-color:var(--fill)}
.btn.primary:hover{background:var(--fill-h)}
.btn.danger{color:var(--dng);border-color:var(--dng-line)}
.btn.danger.armed{background:#B42318;color:#fff;border-color:#B42318}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--fill);color:var(--fill-fg)}
.seg button:disabled{opacity:.35;cursor:default}

/* ---------- Layout ---------- */
main{flex:1;min-height:0;display:flex;gap:var(--gap);padding:0 var(--pad) 16px;width:100%;max-width:var(--wrap);margin-left:auto;margin-right:auto}
.side{width:var(--sidew);flex:none;background:var(--panel);border-radius:18px;box-shadow:var(--shadow);overflow:auto;display:flex;flex-direction:column;min-height:0;align-self:flex-start;max-height:100%}
.side h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.side .hint{margin:0 0 10px;color:var(--muted);font-size:12.5px;line-height:1.45}
.right{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}

/* ---------- Side panel: collapsible + settings ---------- */
.side-full{display:flex;flex-direction:column;gap:14px;padding:16px;min-height:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.side .sec-head h3{margin:0}
.ib{width:28px;height:28px;border:0;background:transparent;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.set-sec{border-top:1px solid var(--line2);padding-top:4px}
.acc{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:8px 2px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left}
.acc:hover{color:var(--ink)}
.acc .chev{margin-left:auto;transition:transform .18s}
.acc[aria-expanded="true"] .chev{transform:rotate(180deg)}
.set-body{padding:4px 2px 2px;display:flex;flex-direction:column;gap:12px}
.set-body h4{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--ink)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.set-body .sh h4{margin:0}
.sh .status{margin:0;font-size:12px;color:var(--muted);white-space:nowrap}
.pref{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pref .lbl{font-size:12.5px}
.alert-dot{display:none;width:8px;height:8px;border-radius:50%;background:#F59E0B;flex:none}
.alert-dot.on{display:inline-block}
.side-rail{display:none}
body.side-off .side{width:var(--railw)}
body.side-off .side-full{display:none}
body.side-off .side-rail{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;padding:12px 0 14px;border:0;background:transparent;color:var(--muted)}
.side-rail:hover{color:var(--ink)}
.side-rail .rail-tx{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}

/* ---------- Day bar (above the grid) ---------- */
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.daybar .dl{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- Library ---------- */
.lib{display:flex;flex-direction:column;gap:8px}
.tcard{--c:#999;position:relative;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--c);
  cursor:grab;user-select:none;touch-action:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.08);
  transition:transform .12s,box-shadow .12s}
.tcard:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 6px 14px rgba(30,34,48,.16)}
.tcard .ic{font-size:20px;width:26px;text-align:center;flex:none}
.tcard .meta{display:flex;flex-direction:column;min-width:0;flex:1}
.tcard .meta b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .meta small{opacity:.78;font-size:12px}
.tcard .edit{border:0;background:rgba(255,255,255,.0);color:inherit;opacity:.0;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;transition:opacity .12s,background .12s}
.tcard:hover .edit,.tcard:focus-within .edit{opacity:.75}
.tcard .edit:hover{background:rgba(0,0,0,.14);opacity:1}
.add-task{border:1.5px dashed var(--dash);background:transparent;border-radius:12px;padding:11px;color:var(--muted);font-weight:600;transition:all .15s}
.add-task:hover{border-color:var(--ink);color:var(--ink);background:var(--hover2)}
.ghost{position:fixed;z-index:1000;pointer-events:none;width:230px;transform:rotate(-2deg);box-shadow:0 14px 30px rgba(30,34,48,.28)!important;opacity:.95}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
body.is-resizing,body.is-resizing *{cursor:ns-resize!important;user-select:none!important;-webkit-user-select:none!important}

.panel-sec .row{display:flex;gap:6px;flex-wrap:wrap}
.status{font-size:12.5px;line-height:1.45;margin:0 0 8px;color:var(--ink)}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#B8B2A3}
.status .dot.ok{background:#22C55E}.status .dot.bad{background:var(--red)}.status .dot.warn{background:#F59E0B}

/* ---------- Week bar ---------- */
.weekbar{display:flex;align-items:stretch;gap:6px}
.weekbar .wk{border:1px solid var(--line);background:var(--panel);border-radius:12px;width:30px;font-size:16px;color:var(--muted)}
.weekbar .wk:hover{background:var(--hover2);color:var(--ink)}
.chips{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:0}
.chip{border:1px solid transparent;background:var(--panel);border-radius:12px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:var(--shadow);transition:transform .12s,background .12s;min-width:0}
.chip:hover{transform:translateY(-1px)}
.chip .wd{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.chip .dn{font-size:17px;font-weight:700;line-height:1.1}
.chip .dots{display:flex;gap:3px;height:6px;margin-top:3px}
.chip .dots i{width:6px;height:6px;border-radius:50%;display:block}
.chip.sel{background:var(--fill);color:var(--fill-fg)}
.chip.sel .wd{color:var(--fill-sub)}
.chip.istoday:not(.sel) .dn{color:var(--red)}
.chip.drop{border-color:var(--focus);background:var(--drop-bg);transform:scale(1.04)}
.chip.sel.drop{background:var(--drop-sel);color:#fff}

/* ---------- Grid ---------- */
.gridpanel{flex:1;min-height:0;background:var(--panel);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex}
.scroll{flex:1;overflow-y:auto;position:relative}
.tl-grid{display:flex;flex-direction:row;align-items:flex-start;padding:12px 14px 12px 0;position:relative}
.gutter{width:64px;flex:none;position:relative}
.gutter span{position:absolute;right:10px;transform:translateY(-50%);font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.track{flex:1;position:relative;min-width:0;border-bottom:1px solid var(--line);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(var(--line2) 1px,transparent 1px);
  background-size:100% var(--hour),100% var(--hour);background-position:0 0,0 calc(var(--hour)/2)}
.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--faint);font-size:14px;text-align:center;padding:0 20px;z-index:0}
.empty div{max-width:300px;line-height:1.5}
.now{position:absolute;left:-6px;right:0;height:0;border-top:2px solid var(--red);z-index:15;pointer-events:none}
.now::before{content:'';position:absolute;left:0;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--red)}

.ev{--c:#999;position:absolute;border-radius:10px;background:var(--c);padding:6px 10px;overflow:hidden;cursor:grab;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),0 1px 2px rgba(20,20,40,.12);touch-action:none;user-select:none;z-index:2;
  transition:box-shadow .15s,top .22s cubic-bezier(.2,.8,.2,1)}
.ev:hover{box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),0 8px 18px rgba(20,20,40,.2);z-index:5}
.ev.dragging{z-index:30;cursor:grabbing;box-shadow:0 14px 28px rgba(20,20,40,.28);opacity:.96}
.ev .l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;row-gap:1px}
.ev .ic{font-size:15px;flex:none}
.ev .nm{font-weight:600;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .tm{order:3;flex-basis:100%;font-size:12px;opacity:.8;white-space:nowrap}
.ev .bell{order:2;border:0;background:transparent;color:inherit;opacity:.38;min-width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:1px;flex:none;padding:0 3px}
.ev .bell .bn{font-size:10px;font-weight:800;line-height:1}
.ev .bell:hover{background:rgba(0,0,0,.14);opacity:.9}
.ev .bell.on{opacity:1}
.ev .bell.on svg{fill:currentColor}
.ev.compact{padding:0 8px}
.ev.compact .l1{flex-wrap:nowrap;height:100%}
.ev.compact .nm{flex:0 1 auto}
.ev.compact .tm{order:1;flex:1 0 auto;flex-basis:auto;margin-left:4px}
.ev.compact .ic{font-size:13px}
.ev.compact .bell{min-width:18px;height:18px;padding:0 2px}
.ev.compact .bell .bn{font-size:9px}
.ev.compact .bell svg{width:13px;height:13px}
.ev .h{position:absolute;left:0;right:0;height:var(--hh,5px);pointer-events:none;z-index:3;transition:background .1s}
.ev .h.top{top:0}.ev .h.bottom{bottom:0}
.ev .h::after{content:'';position:absolute;left:50%;top:50%;width:30px;height:3px;margin:-1.5px 0 0 -15px;border-radius:3px;background:currentColor;opacity:0;transition:opacity .1s}
.ev[data-zone="top"],.ev[data-zone="bottom"]{cursor:ns-resize}
.ev[data-zone="top"] .h.top,.ev[data-zone="bottom"] .h.bottom{background:rgba(0,0,0,.2)}
.ev[data-zone="top"] .h.top::after,.ev[data-zone="bottom"] .h.bottom::after{opacity:.9}
.ev.resizing{z-index:30;box-shadow:0 10px 22px rgba(20,20,40,.25);transition:box-shadow .15s}
.ev.pushed{z-index:4;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),0 8px 18px rgba(20,20,40,.22)}
.preview{position:absolute;left:4px;right:4px;border:2px dashed var(--c);background:color-mix(in srgb,var(--c) 22%,transparent);border-radius:10px;z-index:25;pointer-events:none;
  font-size:12px;font-weight:600;padding:4px 10px;color:var(--ink)}

/* ---------- Arraste físico ---------- */
.tcard.lifted{opacity:.4;transform:none!important;box-shadow:none;outline:2px dashed var(--lift);outline-offset:-3px}
.dg{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;border-radius:12px;background:var(--c);display:flex;flex-direction:column;justify-content:center;
  padding:0 14px;overflow:hidden;will-change:transform;transform-origin:50% 25%;
  box-shadow:0 22px 44px rgba(30,34,48,.34),0 6px 12px rgba(30,34,48,.22),inset 0 0 0 1px rgba(0,0,0,.08);
  transition:width .22s cubic-bezier(.2,.8,.2,1),height .22s cubic-bezier(.2,.8,.2,1),border-radius .2s,box-shadow .2s,padding .2s}
.dg .l1{display:flex;align-items:center;gap:8px}
.dg .ic{font-size:19px;flex:none}
.dg b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg small{font-size:12px;opacity:.8;margin-left:27px;white-space:nowrap}
.dg.inblock{border-radius:10px;justify-content:flex-start;padding:6px 10px;opacity:.96;
  box-shadow:0 14px 30px rgba(30,34,48,.3),0 3px 8px rgba(30,34,48,.2),inset 0 0 0 1px rgba(0,0,0,.07)}
.dg.inblock .ic{font-size:15px}
.dg.inblock b{font-size:14px}
.dg.inblock small{margin-left:0}
.dg.landing{transition:transform .21s cubic-bezier(.2,.9,.3,1.15),width .21s,height .21s,opacity .21s,box-shadow .21s;box-shadow:0 2px 6px rgba(30,34,48,.18)}
.preview{transition:top .09s ease-out,height .12s ease-out,box-shadow .15s}
.preview.stuck{border-style:solid;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 28%,transparent)}
.guide{position:absolute;left:-6px;right:0;height:0;border-top:2px solid var(--c,#1E2230);opacity:.55;z-index:24;pointer-events:none;display:none}
.tbubble{position:absolute;right:6px;transform:translateY(-50%);background:var(--fill);color:var(--fill-fg);font-size:11.5px;font-weight:600;padding:3px 7px;border-radius:7px;
  z-index:6;display:none;white-space:nowrap;pointer-events:none;box-shadow:0 4px 10px rgba(30,34,48,.25)}
.ev.dragging{transform:scale(1.015);transition:top .09s ease-out,height .09s ease-out,box-shadow .15s,transform .15s}
@keyframes evpop{0%{transform:scale(.95);opacity:.5}60%{transform:scale(1.02);opacity:1}100%{transform:none}}
.ev.pop{animation:evpop .3s cubic-bezier(.2,.9,.3,1.2)}

.checks{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.rmenu{position:fixed;z-index:2500;background:var(--panel2);color:var(--ink);border-radius:12px;box-shadow:0 14px 34px rgba(30,34,48,.28),0 0 0 1px rgba(0,0,0,.05);
  padding:12px 14px;width:270px;display:flex;flex-direction:column;gap:10px;font-size:13.5px;animation:pop .15s}
.rmenu .rm-t{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Modal / toast ---------- */
.overlay{position:fixed;inset:0;background:var(--ov);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:2000;padding:16px;animation:fade .15s}
.modal{background:var(--panel2);border-radius:18px;padding:22px;width:min(440px,100%);max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(30,34,48,.3);animation:pop .18s}
.modal h2{margin:0 0 14px;font-size:20px;letter-spacing:-.01em}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.field>.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input[type=text],.field input[type=time],.field input[type=number]{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--input);width:100%}
.field input:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--fill)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);padding:0}
.sw.sel{box-shadow:0 0 0 2px var(--panel2),0 0 0 4px var(--ink)}
.swatches input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;padding:0;background:var(--input);cursor:pointer}
.emojis{display:flex;flex-wrap:wrap;gap:4px}
.emojis button{border:1px solid transparent;background:var(--chipbg);border-radius:8px;width:34px;height:34px;font-size:17px;padding:0}
.emojis button:hover{border-color:var(--ink)}
.icon-row{display:flex;gap:10px;align-items:center}
.icon-row input{width:64px!important;text-align:center;font-size:20px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;align-items:center}
.mfoot .sp{flex:1}
.err{color:var(--dng);font-size:12.5px;margin:-4px 0 10px;min-height:0}
.days{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.days label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer}
.days label:has(input:checked){background:var(--daysel);border-color:var(--daysel-line)}
.days small{color:var(--muted)}

/* ---- Night mode: same hues as the light palette, but with calmer lightness/saturation (OKLCH) ---- */
const _lin = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
const _gam = c => { c = Math.max(0, Math.min(1, c)); return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; };

  for (let i = 0; i < 60; i++) {

    fired: {},       // lembretes já disparados

function normalize(s) {
  const d = defaultState();

  s.templates = Array.isArray(s.templates) ? s.templates : d.templates;
  s.events = s.events && typeof s.events === 'object' ? s.events : {};
  s.fired = s.fired && typeof s.fired === 'object' ? s.fired : {};
  s.settings = Object.assign({ h24: true, zi: 1, lang: 'en', sideOff: false, dark: false }, s.settings || {});
  s.settings.sideOff = !!s.settings.sideOff;
  s.settings.dark = s.settings.dark === true;
  s.settings.tourDone = s.settings.tourDone === true;
  if (typeof s.settings.setOpen !== 'boolean') delete s.settings.setOpen;
  if (!LANGS.includes(s.settings.lang)) s.settings.lang = 'en';
  if (!Number.isInteger(s.settings.zi) || s.settings.zi < 0 || s.settings.zi >= ZLEVELS.length) s.settings.zi = 1;
  // a grade agora é 9h–21h: ajusta blocos antigos que ficavam fora dessa faixa
  Object.keys(s.events).forEach(k => {
    s.events[k] = (Array.isArray(s.events[k]) ? s.events[k] : [])
      .map(e => ({ ...e, start: Math.max(e.start, MIN_T), end: Math.min(e.end, MAX_T) }))
      .filter(e => e.end - e.start >= MIN_DUR);
  });
  // v2: tasks pré-definidas passam a ter 1h de duração padrão
  if (!s.version || s.version < 2) {
    s.templates.forEach(t => { if (['t1','t2','t3','t4'].includes(t.id)) t.dur = 60; });
    s.version = 2;
  }
  // v3: Break volta a ter 15 min como padrão (só se ainda estiver com o valor anterior de 60)
  if (s.version < 3) {
    s.templates.forEach(t => { if (t.id === 't3' && t.dur === 60) t.dur = 15; });
    s.version = 3;
  }
  // v4: dois lembretes por bloco — ao iniciar e 10 min antes de acabar (esse só em Chat+Email e Case + Voice por padrão)
  if (s.version < 4) {
    s.templates.forEach(t => { t.remindStart = true; t.remindEnd = ['t1', 't2'].includes(t.id); delete t.remind; });
    Object.keys(s.events).forEach(k => s.events[k].forEach(e => {
      const t = s.templates.find(x => x.id === e.tid);
      e.remindStart = true; e.remindEnd = t ? !!t.remindEnd : false; delete e.remind;
    }));
    s.version = 4;
  }
  // v5: formato 24h passa a ser o padrão (uma única vez; depois dá para voltar para 12h em Settings)
  if (s.version < 5) { s.settings.h24 = true; s.version = 5; }
  // v6: Case + Voice avisa só quando começa (sem o aviso de 10 min antes de acabar). Vale para o modelo e para os blocos de hoje em diante.
  if (s.version < 6) {
    const t2 = s.templates.find(t => t.id === 't2');
    if (t2) t2.remindEnd = false;
    const todayK = keyOf(new Date());
    Object.keys(s.events).forEach(k => { if (k >= todayK) s.events[k].forEach(e => { if (e.tid === 't2') e.remindEnd = false; }); });
    s.version = 6;
  }
  // limpa avisos antigos (> 3 dias)

const ALERT_MS = 8000;
function reminderToast(title, body, color, emoji) {
  let box = document.getElementById('ralerts');
  if (!box) { box = el('div', { id: 'ralerts', role: 'alert', 'aria-live': 'assertive' }); document.body.append(box); }
  const a = el('div', { class: 'rem-alert', style: `--c:${color};--fg:${textOn(color)};--dur:${ALERT_MS}ms` },
    el('div', { class: 'ra-ic' }, emoji || '🔔'),
    el('div', { class: 'ra-tx' }, el('b', {}, title), el('span', {}, body)),
    el('button', { class: 'ra-x', 'aria-label': say('close'), onclick: () => close() }, '×'),
    el('div', { class: 'ra-bar' }, el('i')));
  box.append(a);
  // o tempo só corre enquanto você está olhando: pausa com o mouse/foco em cima ou com a aba em segundo plano
  let left = ALERT_MS, t0 = 0, tm = null, over = false, dead = false;
  const tick = () => {
    if (dead) return;
    const hold = over || document.hidden;
    if (hold) { if (tm) { clearTimeout(tm); tm = null; left -= Date.now() - t0; } a.classList.add('paused'); }
    else if (!tm) { t0 = Date.now(); tm = setTimeout(close, Math.max(left, 0)); a.classList.remove('paused'); }
  };
  const close = () => {
    if (dead) return;
    dead = true; clearTimeout(tm); tm = null;
    document.removeEventListener('visibilitychange', tick);
    a.classList.add('out'); setTimeout(() => a.remove(), 240);
  };
  a.addEventListener('mouseenter', () => { over = true; tick(); });
  a.addEventListener('mouseleave', () => { over = false; tick(); });
  a.addEventListener('focusin', () => { over = true; tick(); });
  a.addEventListener('focusout', () => { over = false; tick(); });
  document.addEventListener('visibilitychange', tick);
  tick();
}

function layout(evs) {
  const s = [...evs].sort((a, b) => a.start - b.start || b.end - a.end);
  const res = {}; let cluster = [], cols = [], cEnd = -1;
  const flush = () => { cluster.forEach(e => res[e.id].cols = cols.length); cluster = []; cols = []; };
  s.forEach(e => {
    if (cluster.length && e.start >= cEnd) { flush(); cEnd = -1; }
    let c = cols.findIndex(end => end <= e.start);
    if (c < 0) { c = cols.length; cols.push(0); }
    cols[c] = e.end; res[e.id] = { col: c, cols: 1 }; cluster.push(e); cEnd = Math.max(cEnd, e.end);
  });
  flush(); return res;
}

/* ================= Event operations ================= */
const findEv = (key, id) => dayEvents(key).find(e => e.id === id);
const otherEvents = (key, ignoreId) => dayEvents(key).filter(e => e.id !== ignoreId);

// intervalos livres entre os blocos, dentro da faixa visível da grade
function freeIntervals(list) {
  const s = [...list].sort((a, b) => a.start - b.start), res = []; let c = MIN_T;
  s.forEach(e => { if (e.start > c) res.push([c, Math.min(e.start, MAX_T)]); c = Math.max(c, e.end); });
  if (c < MAX_T) res.push([c, MAX_T]);
  return res;
}

// ajusta uma borda: ímã nos vizinhos, depois nos quartos de hora, senão passos de 5 min
function snapEdge(raw, magnets) {
  let best = null, bd = Infinity;
  magnets.forEach(m => { const d = Math.abs(m - raw); if (d <= magnetMin() && d < bd) { bd = d; best = m; } });
  if (best != null) return best;
  const q = Math.round(raw / QUARTER) * QUARTER;
  if (Math.abs(q - raw) <= quarterMin()) return q;
  return Math.round(raw / SNAP) * SNAP;
}

// Onde um bloco de duração `dur`, com o topo em `raw` (minutos), realmente fica.
// Nunca sobrepõe outro bloco: gruda nas bordas vizinhas; se cair em cima de outro, vai para o espaço livre mais próximo.
function placeBlock(key, raw, dur, ignoreId, shrink) {

// Editar horário digitando: se o bloco crescer sobre os de baixo, eles são reajustados em cascata (colam no novo fim).
function planEdit(key, id, s, f) {
  const e = findEv(key, id);
  const list = otherEvents(key, id).sort((a, b) => a.start - b.start);
  // mudou a duração e o bloco continua sobre o lugar antigo = ajuste de borda: os vizinhos acompanham e continuam colados
  if (f - s !== e.end - e.start && s < e.end && f > e.start) {
    const after = list.filter(x => x.start >= e.end);
    const before = list.filter(x => x.end <= e.start).sort((a, b) => b.end - a.end);
    const mE = planEnd(after, e.end, f); if (!mE) return { error: say('errNoFit', { t: fmt(MAX_T) }) };
    const mS = planStart(before, e.start, s); if (!mS) return { error: say('errNoFitTop', { t: fmt(MIN_T) }) };
    return { moves: { ...mE, ...mS } };
  }
  // mover o bloco (mesma duração ou outro lugar): empurra só o que ficaria sobreposto; o vão que sobra é seu
  const above = list.find(x => x.start < s && x.end > s);
  if (above) return { error: say('errConflict', { name: above.name, s: fmt(above.start), f: fmt(above.end) }) };
  const moves = {}; let cursor = f;
  for (const x of list) {
    if (x.start < s) continue;
    const len = x.end - x.start;
    if (x.start < cursor) { moves[x.id] = { start: cursor, end: cursor + len }; cursor += len; }
    else cursor = Math.max(cursor, x.end);
  }
  if (cursor > MAX_T) return { error: say('errNoFit', { t: fmt(MAX_T) }) };
  return { moves };
}

const nameKey = x => String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
const cleanName = x => x.replace(/^[\s\-–—|•·:;,]+/, '').replace(/[\s\-–—|•·:;,]+$/, '').replace(/\s+/g, ' ');
const TOKEN_RE = /\b(\d{1,2})(?::(\d{2}))?\s*(?:([ap])\.?\s?m\b\.?)?/gi;
const NEW_COLORS = ['#EC4899', '#A855F7', '#14B8A6', '#EF4444', '#3B82F6', '#84CC16', '#F97316', '#78716C'];
const guessIcon = x => /meet|reuni|sync|stand|1:1/i.test(x) ? '👥' : /train|capacit|treina|learn|curso|course/i.test(x) ? '🎓' : /call|phone|llamada|ligaç|ligac/i.test(x) ? '📞' : '📌';
function clock(h, m, mer) {
  if (m > 59) return NaN;
  if (mer) { if (h < 1 || h > 12) return NaN; return ((h % 12) + (mer === 'p' ? 12 : 0)) * 60 + m; }
  if (h > 24 || (h === 24 && m > 0)) return NaN;
  return h * 60 + m;
}
// uma linha: "Nome  09:00 AM  11:00 AM  <qualquer coisa>"  (tabs, espaços, 12h ou 24h). Linhas sem horário são ignoradas.
function parseLine(raw) {
  const line = String(raw).replace(/\u00a0/g, ' ').trim(); if (!line) return null;
  const toks = [];
  for (const m of line.matchAll(TOKEN_RE)) {
    if (m[2] === undefined && !m[3]) continue;
    toks.push({ h: +m[1], m: m[2] === undefined ? 0 : +m[2], mer: m[3] ? m[3].toLowerCase() : '', i: m.index, j: m.index + m[0].length });
  }
  if (!toks.length) return null;
  const r = { raw: line };
  if (toks.length < 2) { r.err = 'pErrTime'; return r; }
  const a = toks[0], b = toks[1];
  r.name = cleanName(line.slice(0, a.i)) || cleanName(line.slice(b.j));
  if (!nameKey(r.name)) { r.err = 'pErrName'; return r; }
  let s, e;
  if (!a.mer && b.mer && a.h >= 1 && a.h <= 12) {            // "9:00 – 11:00 AM": o início herda o AM/PM do fim
    e = clock(b.h, b.m, b.mer); s = clock(a.h, a.m, b.mer);
    if (s >= e) s = clock(a.h, a.m, b.mer === 'a' ? 'p' : 'a');
  } else { s = clock(a.h, a.m, a.mer); e = clock(b.h, b.m, b.mer); }
  if (isNaN(s) || isNaN(e)) { r.err = 'pErrTime'; return r; }
  if (e <= s) { r.err = 'pErrOrder'; return r; }
  if (e - s < MIN_DUR) { r.err = 'pErrShort'; return r; }
  const s2 = Math.max(s, MIN_T), e2 = Math.min(e, MAX_T);
  if (e2 - s2 < MIN_DUR) { r.err = 'pErrOut'; return r; }
  r.start = s2; r.end = e2; r.clipped = s2 !== s || e2 !== e;
  return r;
}
// lê o texto inteiro e descobre, para cada linha, a task (existente ou nova) e se cabe no dia
function planPaste(text, replace) {
  const key = curKey(), old = replace ? [] : dayEvents(key), got = [], pending = {}, rows = [];
  const used = new Set(state.templates.map(t => String(t.color).toLowerCase()));
  String(text).split(/\r?\n/).forEach(line => {
    const r = parseLine(line); if (!r) return;
    rows.push(r);
    if (r.err) return;
    if (old.some(x => r.start < x.end && r.end > x.start)) { r.err = 'pErrOverOld'; return; }
    if (got.some(x => r.start < x.end && r.end > x.start)) { r.err = 'pErrOver'; return; }
    got.push(r);
    const k = nameKey(r.name);
    let t = state.templates.find(x => nameKey(x.name) === k);
    if (!t && k.length >= 4) {
      const c = state.templates.filter(x => { const tk = nameKey(x.name); return tk.length >= 4 && (tk.startsWith(k) || k.startsWith(tk)); });
      if (c.length === 1) t = c[0];
    }
    if (t) { r.tid = t.id; r.name = t.name; r.color = t.color; r.icon = t.icon; return; }
    let p = pending[k];
    if (!p) {
      const color = NEW_COLORS.find(c => !used.has(c.toLowerCase())) || PALETTE[Object.keys(pending).length % PALETTE.length];
      used.add(color.toLowerCase());
      p = pending[k] = { name: r.name, color, icon: guessIcon(r.name), dur: Math.max(5, Math.round((r.end - r.start) / 5) * 5) };
    }
    r.pkey = k; r.isNew = true; r.color = p.color; r.icon = p.icon;
  });
  return { rows, valid: rows.filter(r => !r.err), pending };
}
function applyPaste(plan, replace) {
  const key = curKey(), before = JSON.parse(JSON.stringify(dayEvents(key))), made = {}, madeIds = [];
  plan.valid.forEach(r => {
    if (r.tid || made[r.pkey]) return;
    const p = plan.pending[r.pkey];
    const t = { id: uid(), name: p.name, color: p.color, icon: p.icon, dur: p.dur, remindStart: true, remindEnd: false };
    state.templates.push(t); made[r.pkey] = t.id; madeIds.push(t.id);
  });
  if (replace) state.events[key] = [];
  const evs = dayEvents(key);
  plan.valid.forEach(r => {
    const t = tpl(r.tid || made[r.pkey]);
    evs.push({ id: uid(), tid: t.id, name: t.name, color: t.color, icon: t.icon, start: r.start, end: r.end, remindStart: !!t.remindStart, remindEnd: !!t.remindEnd });
  });
  silenceDay(key); save(); closeModal(); renderAll();
  const n = plan.valid.length;
  toast(say('pasted', { n: `${n} ${say(n === 1 ? 'blockOne' : 'blockMany')}` }) + (madeIds.length ? ' · ' + say('pasteSumNew', { k: madeIds.length }) : ''), {
    ms: 9000,
    undo: () => {
      state.events[key] = before; state.templates = state.templates.filter(t => !madeIds.includes(t.id));
      save(); renderAll(); toast(say('undone'));
    }
  });
}

let actx = null;
function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.resume) actx.resume(); } catch (e) {} }
document.addEventListener('pointerdown', unlockAudio, { once: true });
function beep() {
  try {
    unlockAudio(); if (!actx) return;
    [0, 0.2, 0.4].forEach(d => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + d;
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + 0.2);
    });
  } catch (e) {}
}
// quadradinho colorido (emoji) mais próximo da cor do bloco: dá cor ao título do aviso do sistema
function colorSquare(hex) {
  const h = String(hex || '#6366F1').replace('#', '');
  const r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l = (mx + mn) / 2;
  if (!(d >= 0.08)) return l > 0.6 ? '⬜' : '⬛';
  let hue = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  hue = (hue * 60 + 360) % 360;
  if (hue < 15 || hue >= 330) return '🟥';
  if (hue < 45) return '🟧';
  if (hue < 70) return '🟨';
  if (hue < 185) return '🟩';
  if (hue < 225) return '🟦';
  return '🟪';
}
// ícone quadrado na cor do bloco, com o emoji da task (usado no aviso do sistema e na aba do navegador)
const iconCache = {};
function alertIcon(color, emoji, size) {
  const key = `${color}|${emoji}|${size}`;
  if (iconCache[key]) return iconCache[key];
  try {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d'); if (!x) return '';
    x.fillStyle = color; x.beginPath();
    if (x.roundRect) x.roundRect(0, 0, size, size, size * 0.22); else x.rect(0, 0, size, size);
    x.fill();
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = `${Math.round(size * 0.56)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    x.fillText(emoji || '🔔', size / 2, size / 2 + size * 0.04);
    return (iconCache[key] = c.toDataURL('image/png'));
  } catch (e) { return ''; }
}
// aba em segundo plano: o título pisca com a cor do bloco e o ícone da aba muda, até você voltar
let flashT = null, flashLink = null;
function stopAttention() {
  if (flashT) { clearInterval(flashT); flashT = null; document.title = say('pageTitle'); }
  if (flashLink) { flashLink.remove(); flashLink = null; }
}
function startAttention(title, color, emoji) {
  if (!document.hidden && document.hasFocus()) return;      // se você já está olhando a aba, o banner da página basta
  stopAttention();
  const dot = colorSquare(color), ic = alertIcon(color, emoji, 64);
  if (ic) { flashLink = el('link', { rel: 'icon', type: 'image/png', href: ic }); document.head.append(flashLink); }
  let on = false;
  const tick = () => { on = !on; document.title = on ? `${dot} ${title}` : `🔔 ${say('pageTitle')}`; };
  tick(); flashT = setInterval(tick, 900);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) stopAttention(); });
window.addEventListener('focus', stopAttention);

function notify(title, body, color, tag, emoji) {
  reminderToast(title, body, color, emoji); beep(); startAttention(title, color, emoji);
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      const opts = { body, tag, requireInteraction: true };
      const ic = alertIcon(color, emoji, 128); if (ic) opts.icon = ic;
      const n = new Notification(`${colorSquare(color)} ${emoji ? emoji + ' ' : ''}${title}`, opts);
      n.onclick = () => { window.focus(); n.close(); };
    }
  } catch (e) {}
}
$('#notifBtn').onclick = async () => {
  try { await Notification.requestPermission(); } catch (e) { toast(say('permFail')); }
  renderStatus();
};
$('#notifTest').onclick = () => {          // dispara em 5 s para dar tempo de trocar de aba e ver o aviso em segundo plano
  toast(say('testWait'), { ms: 5000 });
  const c = (state.templates[0] && state.templates[0].color) || '#F59E0B';
  setTimeout(() => notify(say('testTitle'), say('testBody'), c, 'test', '🔔'), 5000);
};

// marca como "já avisado" os gatilhos que já passaram ao editar/criar blocos de hoje (evita aviso atrasado)
function silenceDay(key) {
  const now = new Date(); if (key !== keyOf(now)) return;
  const nm = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  (state.events[key] || []).forEach(e => {
    if (nm >= e.start) state.fired[`${key}|${e.id}|s|${e.start}`] = 1;
    if (nm >= Math.max(e.end - REMIND_BEFORE, e.start)) state.fired[`${key}|${e.id}|e|${e.end}`] = 1;
  });
}
function checkReminders() {
  const now = new Date(), dk = keyOf(now);
  const nm = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  (state.events[dk] || []).forEach(e => {
    if (e.remindStart) {                       // quando começa (tolerância de 2 min se a aba estava "dormindo")
      const id = `${dk}|${e.id}|s|${e.start}`;
      if (!state.fired[id] && nm >= e.start && nm < Math.min(e.start + 2, e.end)) {
        state.fired[id] = 1; save();
        notify(say('startsNow', { name: e.name }), `${fmt(e.start)} – ${fmt(e.end)}`, e.color, id, e.icon || '⏰');
      }
    }
    if (e.remindEnd) {                         // 10 min antes de acabar
      const id = `${dk}|${e.id}|e|${e.end}`;
      if (!state.fired[id] && nm >= Math.max(e.end - REMIND_BEFORE, e.start) && nm < e.end) {
        state.fired[id] = 1; save();
        const mins = Math.max(1, Math.ceil(e.end - nm));
        const title = e.tid === 't1' ? say('pause10') : say('endsIn', { name: e.name, n: mins });   // Chat+Email: o aviso de 10 min vira "10 minutes pause"
        notify(title, say('endsAt', { e: fmt(e.end), s: fmt(e.start), f: fmt(e.end) }), e.color, id, e.icon || '⏰');
      }
    }
  });
}


/* ================= Tutorial (first visit) ================= */
const isMac = () => /mac|iphone|ipad/i.test((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent || '');
const TOUR_DEMO = [['Chat+Email', '09:00 AM', '11:00 AM', '#F59E0B', 120], ['Case + Voice - Online', '11:00 AM', '12:00 PM', '#22C55E', 60], ['Break', '12:00 PM', '12:15 PM', '#38BDF8', 15],
                   ['Chat+Email', '12:15 PM', '02:00 PM', '#F59E0B', 105], ['Lunch', '02:00 PM', '03:00 PM', '#6366F1', 60]];
// texto com **negrito** e `código` -> nós do DOM (os textos são todos nossos)
function rich(s) {
  return String(s).split(/(\*\*[^*]+\*\*|`[^`]+`)/).filter(Boolean).map(p =>
    p.startsWith('**') ? el('b', {}, p.slice(2, -2)) : p.startsWith('`') ? el('code', {}, p.slice(1, -1)) : p);
}
function openTour(start) {
  const N = 3; let i = Math.max(0, Math.min(N - 1, start || 0));
  const body = el('div', { class: 'tbox' });
  const tip = (ico, txt, extra) => el('div', { class: 'tour-tip' }, el('span', { class: 'ti' }, ico), el('div', {}, txt, extra));
  const draw = () => {
    const titles = [say('tourT1'), say('tourT2'), say('tourT3')];
    const h = modalEl && modalEl.querySelector('h2'); if (h) h.textContent = titles[i];
    const dlg = modalEl && modalEl.querySelector('.modal'); if (dlg) dlg.setAttribute('aria-label', titles[i]);
    body.innerHTML = '';
    if (i === 0) {
      body.append(
        el('p', { class: 'tbody' }, say('tourB1', { k: isMac() ? 'Cmd+V' : 'Ctrl+V' })),
        el('div', { class: 'tour-demo' },
          el('div', { class: 'tour-src' }, TOUR_DEMO.map(r => el('div', {}, `${r[0]}  ${r[1]}  ${r[2]}`))),
          el('div', { class: 'tour-keys' }, el('div', { class: 'kk' }, el('kbd', {}, isMac() ? '⌘' : 'Ctrl'), el('kbd', {}, 'V')), el('span', {}, '➜')),
          el('div', { class: 'tour-grid' }, TOUR_DEMO.map((r, k) => el('i', { style: `--c:${shade(r[3])};height:${Math.max(6, r[4] / 5)}px;--i:${k}` })))));
    } else if (i === 1) {
      body.append(el('div', { class: 'tour-tips' },
        tip('✋', say('tourTip1')), tip('↕️', say('tourTip2')), tip('➕', say('tourTip3', { t: say('yourTasks') }))));
    } else {
      const has = 'Notification' in window, perm = has ? Notification.permission : 'none';
      const ask = perm === 'default' ? el('button', { type: 'button', class: 'btn sm', onclick: async () => {
        try { await Notification.requestPermission(); } catch (e) { toast(say('permFail')); }
        renderStatus(); applySide(); draw();
      } }, say('tourNotif')) : null;
      const cls = { granted: 'ok', denied: 'bad', default: 'warn', none: 'bad' }[perm];
      const lbl = { granted: 'notifOn', denied: 'notifDenied', default: 'notifOff', none: 'notifNone' }[perm];
      const hl = { default: 0, denied: 1, granted: 2 }[perm];       // destaca o passo que provavelmente falta
      const mac = isMac();
      const step = (n, ttl, txt, extra) => el('div', { class: 'tour-tip' + (hl === n - 1 ? ' hl' : '') }, el('span', { class: 'ti num' }, String(n)),
        el('div', {}, el('b', { class: 'tth' }, ttl), el('div', { class: 'ttd' }, rich(txt)), extra));
      body.append(
        el('div', { class: 'tour-stat' }, el('i', { class: cls }), `${say('tourNStat')}: ${say(lbl)}`),
        el('div', { class: 'tour-tips' },
          step(1, say('tourN1T'), say('tourN1', { btn: say('tourNotif') }), ask),
          step(2, say('tourN2T'), say('tourN2')),
          step(3, say(mac ? 'tourN3TMac' : 'tourN3TWin'), say(mac ? 'tourN3Mac' : 'tourN3Win'))));
    }
    const next = el('button', { type: 'button', class: 'btn primary', onclick: () => { if (i < N - 1) { i++; draw(); } else closeModal(); } }, i < N - 1 ? say('tourNext') : say('tourDone'));
    body.append(
      el('div', { class: 'tdots' }, [0, 1, 2].map(k => el('i', { class: k === i ? 'on' : '' }))),
      el('div', { class: 'mfoot' },
        i < N - 1 ? el('button', { type: 'button', class: 'btn tskip', onclick: closeModal }, say('tourSkip')) : null,
        el('span', { class: 'sp' }),
        i > 0 ? el('button', { type: 'button', class: 'btn', onclick: () => { i--; draw(); } }, say('tourBack')) : null,
        next));
    next.focus();
  };
  openModal(say('tourT1'), body, 'wide tour');
  draw();
}
$('#tourBtn').onclick = () => openTour(0);

/* ================= Init ================= */
/* ================= Side panel (collapse) & settings ================= */
function needsNotifSetup() { return ('Notification' in window) && Notification.permission !== 'granted'; }
// "Settings" abre sozinho enquanto as notificações ainda não foram ativadas; depois lembra a sua escolha
function setOpenNow() { return typeof state.settings.setOpen === 'boolean' ? state.settings.setOpen : (('Notification' in window) && Notification.permission === 'default'); }
function applySide() {
  const off = !!state.settings.sideOff, open = setOpenNow(), warn = needsNotifSetup();
  document.body.classList.toggle('side-off', off);
  $('#setBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
  $('#setBody').hidden = !open;
  $('#setDot').classList.toggle('on', warn && !open);
  $('#railDot').classList.toggle('on', warn);
}
function setSide(off) { state.settings.sideOff = off; save(); applySide(); relayout(); }
$('#sideHide').onclick = () => setSide(true);
$('#sideShow').onclick = () => setSide(false);
$('#setBtn').onclick = () => { state.settings.setOpen = !setOpenNow(); save(); applySide(); };

function applyTheme() {
  const d = isDark();
  document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
  const mt = $('#metaTheme'); if (mt) mt.setAttribute('content', d ? '#1D202A' : '#F4F1EA');
  const sw = $('#nightSw'); if (sw) sw.setAttribute('aria-checked', d ? 'true' : 'false');
}
$('#nightSw').onclick = () => {
  state.settings.dark = !state.settings.dark; save();
  const root = document.documentElement; root.classList.add('theme-fade');
  applyTheme(); renderAll();
  setTimeout(() => root.classList.remove('theme-fade'), 380);
};

function applyI18n() {
  const L = lang();
  document.documentElement.lang = LOCALE[L];
  document.title = say('pageTitle');
  document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = say(n.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach(n => { n.title = say(n.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-aria]').forEach(n => { n.setAttribute('aria-label', say(n.dataset.i18nAria)); });
  const cd = $('#clearDay'); if (cd) cd.classList.remove('armed');
  LANGS.forEach(l => { const b = $('#lang-' + l); if (b) { b.classList.toggle('on', l === L); b.setAttribute('aria-pressed', l === L ? 'true' : 'false'); } });
}
function setLang(l) {
  if (!LANGS.includes(l) || l === state.settings.lang) return;
  state.settings.lang = l; save();
  closeModal(); closeRMenu();
  applyI18n(); buildAxis(); renderAll(); updateZoomUI();
}
LANGS.forEach(l => { const b = $('#lang-' + l); if (b) b.onclick = () => setLang(l); });

applyTheme();
applyI18n();
applySide();
buildAxis();
renderAll();
sizePanel();
updateZoomUI();
fitGrid();
scrollToNow();
checkReminders();
// primeira visita: mostra o tutorial uma única vez (dá para rever em Settings)
if (!state.settings.tourDone) { state.settings.tourDone = true; save(); setTimeout(() => { if (!modalEl) openTour(0); }, 600); }
// Ritmo dos lembretes. O Chrome atrasa os timers de abas em segundo plano (depois de ~5 min escondida eles só rodam 1x por minuto).
// Timers dentro de um Worker não sofrem esse atraso: um Worker "bate o ponto" a cada segundo. O setInterval fica como reserva.
try {
  const wurl = URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},1000)'], { type: 'text/javascript' }));
  const beat = new Worker(wurl);
  beat.onmessage = () => checkReminders();
  beat.onerror = () => { try { beat.terminate(); } catch (e) {} };
} catch (e) {}
setInterval(checkReminders, 5000);
setInterval(updateNow, 30000);
// ao voltar para a aba (ou ao acordar o Mac), confere na hora
const catchUp = () => { if (!document.hidden) { checkReminders(); updateNow(); } };
document.addEventListener('visibilitychange', catchUp);
window.addEventListener('focus', catchUp);
window.addEventListener('pageshow', catchUp);
})();
</script>
