<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EA; --panel:#FFFFFF; --ink:#1E2230; --muted:#707482;
  --line:#E4DFD3; --line2:#EFEBE1; --red:#E5484D; --hour:52px;
  --shadow:0 1px 2px rgba(30,34,48,.06),0 4px 14px rgba(30,34,48,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid #3B82F6;outline-offset:2px}

/* ---------- Top bar ---------- */
.top{display:flex;align-items:center;gap:20px;padding:14px 20px 10px;flex-wrap:wrap}
.top .left{min-width:220px;flex:1}
.top h1{margin:0;font-size:24px;letter-spacing:-.02em;font-weight:700}
.top .sub{color:var(--muted);margin-top:2px;font-size:13px}
.nav{display:flex;align-items:center;gap:6px;background:var(--panel);padding:4px;border-radius:12px;box-shadow:var(--shadow)}
.nav button,.nav input{border:0;background:transparent;border-radius:8px;padding:7px 11px;font-weight:500}
.nav button:hover{background:#F0ECE3}
.nav .today{background:var(--ink);color:#fff}
.nav .today:hover{background:#343A50}
.nav input[type=date]{cursor:pointer}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:10px;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{background:#F8F5EE;border-color:#D8D2C3}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#343A50}
.btn.danger{color:#B42318;border-color:#F3C7C3}
.btn.danger.armed{background:#B42318;color:#fff;border-color:#B42318}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.seg button:disabled{opacity:.35;cursor:default}

/* ---------- Layout ---------- */
main{flex:1;min-height:0;display:flex;gap:16px;padding:0 20px 16px}
.side{width:300px;flex:none;background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:18px;min-height:0}
.side h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.side .hint{margin:0 0 10px;color:var(--muted);font-size:12.5px;line-height:1.45}
.right{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}

/* ---------- Library ---------- */
.lib{display:flex;flex-direction:column;gap:8px}
.tcard{--c:#999;position:relative;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--c);
  cursor:grab;user-select:none;touch-action:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.08);
  transition:transform .12s,box-shadow .12s}
.tcard:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 6px 14px rgba(30,34,48,.16)}
.tcard .ic{font-size:20px;width:26px;text-align:center;flex:none}
.tcard .meta{display:flex;flex-direction:column;min-width:0;flex:1}
.tcard .meta b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .meta small{opacity:.78;font-size:12px}
.tcard .edit{border:0;background:rgba(255,255,255,.0);color:inherit;opacity:.0;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;transition:opacity .12s,background .12s}
.tcard:hover .edit,.tcard:focus-within .edit{opacity:.75}
.tcard .edit:hover{background:rgba(0,0,0,.14);opacity:1}
.add-task{border:1.5px dashed #CFC8B7;background:transparent;border-radius:12px;padding:11px;color:var(--muted);font-weight:600;transition:all .15s}
.add-task:hover{border-color:var(--ink);color:var(--ink);background:#FAF8F3}
.ghost{position:fixed;z-index:1000;pointer-events:none;width:230px;transform:rotate(-2deg);box-shadow:0 14px 30px rgba(30,34,48,.28)!important;opacity:.95}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
body.is-resizing,body.is-resizing *{cursor:ns-resize!important;user-select:none!important;-webkit-user-select:none!important}

.panel-sec .row{display:flex;gap:6px;flex-wrap:wrap}
.status{font-size:12.5px;line-height:1.45;margin:0 0 8px;color:var(--ink)}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#B8B2A3}
.status .dot.ok{background:#22C55E}.status .dot.bad{background:var(--red)}.status .dot.warn{background:#F59E0B}

/* ---------- Week bar ---------- */
.weekbar{display:flex;align-items:stretch;gap:6px}
.weekbar .wk{border:1px solid var(--line);background:var(--panel);border-radius:12px;width:30px;font-size:16px;color:var(--muted)}
.weekbar .wk:hover{background:#F8F5EE;color:var(--ink)}
.chips{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:0}
.chip{border:1px solid transparent;background:var(--panel);border-radius:12px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:var(--shadow);transition:transform .12s,background .12s;min-width:0}
.chip:hover{transform:translateY(-1px)}
.chip .wd{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.chip .dn{font-size:17px;font-weight:700;line-height:1.1}
.chip .dots{display:flex;gap:3px;height:6px;margin-top:3px}
.chip .dots i{width:6px;height:6px;border-radius:50%;display:block}
.chip.sel{background:var(--ink);color:#fff}
.chip.sel .wd{color:#B9BDCC}
.chip.istoday:not(.sel) .dn{color:#E5484D}
.chip.drop{border-color:#3B82F6;background:#EAF2FF;transform:scale(1.04)}
.chip.sel.drop{background:#2B3350}

/* ---------- Grid ---------- */
.gridpanel{flex:1;min-height:0;background:var(--panel);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex}
.scroll{flex:1;overflow-y:auto;position:relative}
.tl-grid{display:flex;flex-direction:row;align-items:flex-start;padding:12px 14px 12px 0;position:relative}
.gutter{width:64px;flex:none;position:relative}
.gutter span{position:absolute;right:10px;transform:translateY(-50%);font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.track{flex:1;position:relative;min-width:0;border-bottom:1px solid var(--line);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(var(--line2) 1px,transparent 1px);
  background-size:100% var(--hour),100% var(--hour);background-position:0 0,0 calc(var(--hour)/2)}
.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#B3AD9F;font-size:14px;text-align:center;padding:0 20px;z-index:0}
.empty div{max-width:300px;line-height:1.5}
.now{position:absolute;left:-6px;right:0;height:0;border-top:2px solid var(--red);z-index:15;pointer-events:none}
.now::before{content:'';position:absolute;left:0;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--red)}

.ev{--c:#999;position:absolute;border-radius:10px;background:var(--c);padding:6px 10px;overflow:hidden;cursor:grab;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),0 1px 2px rgba(20,20,40,.12);touch-action:none;user-select:none;z-index:2;
  transition:box-shadow .15s,top .22s cubic-bezier(.2,.8,.2,1)}
.ev:hover{box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),0 8px 18px rgba(20,20,40,.2);z-index:5}
.ev.dragging{z-index:30;cursor:grabbing;box-shadow:0 14px 28px rgba(20,20,40,.28);opacity:.96}
.ev .l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;row-gap:1px}
.ev .ic{font-size:15px;flex:none}
.ev .nm{font-weight:600;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .tm{order:3;flex-basis:100%;font-size:12px;opacity:.8;white-space:nowrap}
.ev .bell{order:2;border:0;background:transparent;color:inherit;opacity:.38;min-width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:1px;flex:none;padding:0 3px}
.ev .bell .bn{font-size:10px;font-weight:800;line-height:1}
.ev .bell:hover{background:rgba(0,0,0,.14);opacity:.9}
.ev .bell.on{opacity:1}
.ev .bell.on svg{fill:currentColor}
.ev.compact{padding:0 8px}
.ev.compact .l1{flex-wrap:nowrap;height:100%}
.ev.compact .nm{flex:0 1 auto}
.ev.compact .tm{order:1;flex:1 0 auto;flex-basis:auto;margin-left:4px}
.ev.compact .ic{font-size:13px}
.ev.compact .bell{min-width:18px;height:18px;padding:0 2px}
.ev.compact .bell .bn{font-size:9px}
.ev.compact .bell svg{width:13px;height:13px}
.ev .h{position:absolute;left:0;right:0;height:var(--hh,5px);pointer-events:none;z-index:3;transition:background .1s}
.ev .h.top{top:0}.ev .h.bottom{bottom:0}
.ev .h::after{content:'';position:absolute;left:50%;top:50%;width:30px;height:3px;margin:-1.5px 0 0 -15px;border-radius:3px;background:currentColor;opacity:0;transition:opacity .1s}
.ev[data-zone="top"],.ev[data-zone="bottom"]{cursor:ns-resize}
.ev[data-zone="top"] .h.top,.ev[data-zone="bottom"] .h.bottom{background:rgba(0,0,0,.2)}
.ev[data-zone="top"] .h.top::after,.ev[data-zone="bottom"] .h.bottom::after{opacity:.9}
.ev.resizing{z-index:30;box-shadow:0 10px 22px rgba(20,20,40,.25);transition:box-shadow .15s}
.ev.pushed{z-index:4;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),0 8px 18px rgba(20,20,40,.22)}
.preview{position:absolute;left:4px;right:4px;border:2px dashed var(--c);background:color-mix(in srgb,var(--c) 22%,transparent);border-radius:10px;z-index:25;pointer-events:none;
  font-size:12px;font-weight:600;padding:4px 10px;color:var(--ink)}

/* ---------- Arraste físico ---------- */
.tcard.lifted{opacity:.4;transform:none!important;box-shadow:none;outline:2px dashed rgba(30,34,48,.28);outline-offset:-3px}
.dg{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;border-radius:12px;background:var(--c);display:flex;flex-direction:column;justify-content:center;
  padding:0 14px;overflow:hidden;will-change:transform;transform-origin:50% 25%;
  box-shadow:0 22px 44px rgba(30,34,48,.34),0 6px 12px rgba(30,34,48,.22),inset 0 0 0 1px rgba(0,0,0,.08);
  transition:width .22s cubic-bezier(.2,.8,.2,1),height .22s cubic-bezier(.2,.8,.2,1),border-radius .2s,box-shadow .2s,padding .2s}
.dg .l1{display:flex;align-items:center;gap:8px}
.dg .ic{font-size:19px;flex:none}
.dg b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg small{font-size:12px;opacity:.8;margin-left:27px;white-space:nowrap}
.dg.inblock{border-radius:10px;justify-content:flex-start;padding:6px 10px;opacity:.96;
  box-shadow:0 14px 30px rgba(30,34,48,.3),0 3px 8px rgba(30,34,48,.2),inset 0 0 0 1px rgba(0,0,0,.07)}
.dg.inblock .ic{font-size:15px}
.dg.inblock b{font-size:14px}
.dg.inblock small{margin-left:0}
.dg.landing{transition:transform .21s cubic-bezier(.2,.9,.3,1.15),width .21s,height .21s,opacity .21s,box-shadow .21s;box-shadow:0 2px 6px rgba(30,34,48,.18)}
.preview{transition:top .09s ease-out,height .12s ease-out,box-shadow .15s}
.preview.stuck{border-style:solid;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 28%,transparent)}
.guide{position:absolute;left:-6px;right:0;height:0;border-top:2px solid var(--c,#1E2230);opacity:.55;z-index:24;pointer-events:none;display:none}
.tbubble{position:absolute;right:6px;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;padding:3px 7px;border-radius:7px;
  z-index:6;display:none;white-space:nowrap;pointer-events:none;box-shadow:0 4px 10px rgba(30,34,48,.25)}
.ev.dragging{transform:scale(1.015);transition:top .09s ease-out,height .09s ease-out,box-shadow .15s,transform .15s}
@keyframes evpop{0%{transform:scale(.95);opacity:.5}60%{transform:scale(1.02);opacity:1}100%{transform:none}}
.ev.pop{animation:evpop .3s cubic-bezier(.2,.9,.3,1.2)}

.checks{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.rmenu{position:fixed;z-index:2500;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 14px 34px rgba(30,34,48,.28),0 0 0 1px rgba(0,0,0,.05);
  padding:12px 14px;width:270px;display:flex;flex-direction:column;gap:10px;font-size:13.5px;animation:pop .15s}
.rmenu .rm-t{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(30,34,48,.42);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:2000;padding:16px;animation:fade .15s}
.modal{background:#fff;border-radius:18px;padding:22px;width:min(440px,100%);max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(30,34,48,.3);animation:pop .18s}
.modal h2{margin:0 0 14px;font-size:20px;letter-spacing:-.01em}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.field>.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input[type=text],.field input[type=time],.field input[type=number]{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%}
.field input:focus{border-color:#3B82F6;outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:#1E2230}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);padding:0}
.sw.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.swatches input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;padding:0;background:#fff;cursor:pointer}
.emojis{display:flex;flex-wrap:wrap;gap:4px}
.emojis button{border:1px solid transparent;background:#F6F3EC;border-radius:8px;width:34px;height:34px;font-size:17px;padding:0}
.emojis button:hover{border-color:var(--ink)}
.icon-row{display:flex;gap:10px;align-items:center}
.icon-row input{width:64px!important;text-align:center;font-size:20px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;align-items:center}
.mfoot .sp{flex:1}
.err{color:#B42318;font-size:12.5px;margin:-4px 0 10px;min-height:0}
.days{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.days label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer}
.days label:has(input:checked){background:#F1EEE6;border-color:#CFC8B7}
.days small{color:var(--muted)}
.quick{display:flex;gap:6px;margin-bottom:6px}
.note{color:var(--muted);font-size:12.5px;line-height:1.45;margin:6px 0 0}

#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:3000;max-width:min(380px,calc(100vw - 36px))}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;box-shadow:0 12px 30px rgba(30,34,48,.35);font-size:13.5px;animation:pop .2s;display:flex;gap:10px;align-items:flex-start}
.toast.rem{background:#fff;color:var(--ink);border-left:6px solid var(--c);padding:14px 14px 14px 14px}
.toast.rem b{display:block;font-size:15px;margin-bottom:2px}
.toast.rem span{color:var(--muted)}
.toast .x{margin-left:auto;border:0;background:transparent;color:inherit;opacity:.6;font-size:18px;line-height:1;padding:0 2px}
.toast .x:hover{opacity:1}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

@media (max-width:860px){
  body{overflow:auto;height:auto}
  main{flex-direction:column;padding:0 12px 12px}
  .side{width:auto;overflow:visible}
  .lib{display:grid;grid-template-columns:repeat(2,1fr)}
  .add-task{grid-column:1/-1}
  .gridpanel{height:75vh;flex:none}
  .top{padding:14px 12px 10px}
  .chip .dn{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="left">
    <h1 id="dateTitle"></h1>
    <div class="sub" id="dateSub"></div>
  </div>
  <div class="nav">
    <button id="prevDay" data-i18n-aria="prevDay" data-i18n-title="prevDayT" aria-label="Previous day" title="Previous day (←)">‹</button>
    <button id="goToday" class="today" data-i18n="today">Today</button>
    <button id="nextDay" data-i18n-aria="nextDay" data-i18n-title="nextDayT" aria-label="Next day" title="Next day (→)">›</button>
    <input type="date" id="datePick" data-i18n-aria="pickDate" aria-label="Pick a date">
  </div>
  <div class="tools">
    <button class="btn" id="copyDay" data-i18n="copyDay">Copy day to…</button>
    <button class="btn danger" id="clearDay" data-i18n="clearDay">Clear day</button>
    <div class="seg" role="group" data-i18n-aria="timeFmt" aria-label="Time format"><button id="f12">12h</button><button id="f24">24h</button></div>
    <div class="seg" role="group" data-i18n-aria="zoomBars" aria-label="Block zoom"><button id="zOut" data-i18n-title="zoomOut" data-i18n-aria="zoomOut" title="Make blocks smaller" aria-label="Make blocks smaller">−</button><button id="zLbl" data-i18n-title="zoomReset" title="Back to the size that fits the screen" style="min-width:52px">100%</button><button id="zIn" data-i18n-title="zoomIn" data-i18n-aria="zoomIn" title="Make blocks bigger" aria-label="Make blocks bigger">+</button></div>
    <div class="seg" role="group" data-i18n-aria="language" aria-label="Language"><button id="lang-en" title="English" aria-label="English">EN</button><button id="lang-es" title="Español" aria-label="Español">ES</button><button id="lang-pt" title="Português" aria-label="Português">PT</button></div>
  </div>
</header>

<main>
  <aside class="side">
    <section>
      <h3 data-i18n="yourTasks">Your tasks</h3>
      <p class="hint" data-i18n="libHint"></p>
      <div class="lib" id="lib"></div>
    </section>
    <section class="panel-sec">
      <h3 data-i18n="reminders">Reminders</h3>
      <p class="status" id="notifStatus"></p>
      <div class="row">
        <button class="btn sm" id="notifBtn" data-i18n="enableNotif">Enable notifications</button>
        <button class="btn sm" id="notifTest" data-i18n="test">Test</button>
      </div>
      <p class="note" data-i18n="remNote"></p>
    </section>
    <section class="panel-sec">
      <h3 data-i18n="data">Data</h3>
      <p class="status" id="storeStatus"></p>
      <div class="row">
        <button class="btn sm" id="exportBtn" data-i18n="exportBackup">Export backup</button>
        <button class="btn sm" id="importBtn" data-i18n="importBackup">Import</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </section>
  </aside>

  <div class="right">
    <div class="weekbar">
      <button class="wk" id="prevWeek" data-i18n-aria="prevWeek" data-i18n-title="prevWeek" aria-label="Previous week" title="Previous week">«</button>
      <div class="chips" id="chips"></div>
      <button class="wk" id="nextWeek" data-i18n-aria="nextWeek" data-i18n-title="nextWeek" aria-label="Next week" title="Next week">»</button>
    </div>
    <div class="gridpanel">
      <div class="scroll" id="scrollEl">
        <div class="tl-grid">
          <div class="gutter" id="gutter"></div>
          <div class="track" id="track"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="toasts" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ================= Config ================= */

/* ================= Formatting ================= */
function fmt(min) {
  const h = Math.floor(min/60) % 24, m = min % 60;
  if (state.settings.h24) return `${pad(h)}:${pad(m)}`;
  const ap = h >= 12 ? 'PM' : 'AM'; const hh = h % 12 === 0 ? 12 : h % 12;
  return `${hh}:${pad(m)} ${ap}`;
}
function fmtHour(h) {
  if (state.settings.h24) return `${pad(h % 24)}:00`;
  h = h % 24;
  return `${h % 12 === 0 ? 12 : h % 12} ${h >= 12 ? 'PM' : 'AM'}`;
}
function fmtDur(m) {
  const h = Math.floor(m/60), r = m % 60;
  if (!h) return `${r} min`;
  return r ? `${h}h${pad(r)}` : `${h}h`;
}
const toInput = m => `${pad(Math.floor(m/60) % 24)}:${pad(m%60)}`;
const fromInput = v => { const [h,m] = v.split(':').map(Number); return h*60 + m; };

function layout(evs) {
  const s = [...evs].sort((a, b) => a.start - b.start || b.end - a.end);
  const res = {}; let cluster = [], cols = [], cEnd = -1;
  const flush = () => { cluster.forEach(e => res[e.id].cols = cols.length); cluster = []; cols = []; };
  s.forEach(e => {
    if (cluster.length && e.start >= cEnd) { flush(); cEnd = -1; }
    let c = cols.findIndex(end => end <= e.start);
    if (c < 0) { c = cols.length; cols.push(0); }
    cols[c] = e.end; res[e.id] = { col: c, cols: 1 }; cluster.push(e); cEnd = Math.max(cEnd, e.end);
  });
  flush(); return res;
}

function placeEv(node, e, s = e.start, f = e.end) {

  node.style.height = h + 'px';
  node.style.left = `calc(${lay.col} * 100% / ${lay.cols} + 4px)`;
  node.style.width = `calc(100% / ${lay.cols} - 8px)`;

  node.style.setProperty('--hh', clamp(h * 0.25, 3, 8) + 'px');   // faixa da bordinha (redimensionar); o resto do bloco move
  node.querySelector('.tm').textContent = `${fmt(s)} – ${fmt(f)}${h >= 44 ? ' · ' + fmtDur(f - s) : ''}`;
  node.setAttribute('aria-label', say('evAria', { name: e.name, s: fmt(s), f: fmt(f), rem: (e.remindStart || e.remindEnd) ? say('withRem') : '' }));
}

/* ================= Event operations ================= */
const findEv = (key, id) => dayEvents(key).find(e => e.id === id);
const otherEvents = (key, ignoreId) => dayEvents(key).filter(e => e.id !== ignoreId);

// intervalos livres entre os blocos, dentro da faixa visível da grade
function freeIntervals(list) {
  const s = [...list].sort((a, b) => a.start - b.start), res = []; let c = MIN_T;
  s.forEach(e => { if (e.start > c) res.push([c, Math.min(e.start, MAX_T)]); c = Math.max(c, e.end); });
  if (c < MAX_T) res.push([c, MAX_T]);
  return res;
}

// ajusta uma borda: ímã nos vizinhos, depois nos quartos de hora, senão passos de 5 min
function snapEdge(raw, magnets) {
  let best = null, bd = Infinity;
  magnets.forEach(m => { const d = Math.abs(m - raw); if (d <= magnetMin() && d < bd) { bd = d; best = m; } });
  if (best != null) return best;
  const q = Math.round(raw / QUARTER) * QUARTER;
  if (Math.abs(q - raw) <= quarterMin()) return q;
  return Math.round(raw / SNAP) * SNAP;
}

// Onde um bloco de duração `dur`, com o topo em `raw` (minutos), realmente fica.
// Nunca sobrepõe outro bloco: gruda nas bordas vizinhas; se cair em cima de outro, vai para o espaço livre mais próximo.
function placeBlock(key, raw, dur, ignoreId, shrink) {
  const list = otherEvents(key, ignoreId);
  const lo = MIN_T, hi = MAX_T - dur;
  if (hi < lo) return null;
  const want = clamp(raw, lo, hi);
  const fits = s => s >= lo && s <= hi && !list.some(e => s < e.end && s + dur > e.start);
  let best = null, bd = Infinity;
  const mags = [hi]; list.forEach(e => mags.push(e.end, e.start - dur));
  mags.forEach(v => { const d = Math.abs(v - want); if (d <= magnetMin() && d < bd && fits(v)) { bd = d; best = v; } });
  if (best == null) { const q = Math.round(want / QUARTER) * QUARTER; if (Math.abs(q - want) <= quarterMin() && fits(q)) best = q; }
  if (best == null) { const s = Math.round(want / SNAP) * SNAP; if (fits(s)) best = s; }
  if (best != null) return { start: best, end: best + dur };
  // ocupado: procura o espaço livre mais próximo que comporte o bloco inteiro
  const free = freeIntervals(list);
  let cand = null, cd = Infinity;
  free.forEach(([a, b]) => {
    if (b - a >= dur) {
      const s = clamp(Math.round(want / SNAP) * SNAP, a, b - dur), d = Math.abs(s - want);
      if (d < cd) { cd = d; cand = { start: s, end: s + dur }; }
    }
  });
  if (cand || !shrink) return cand;
  // nenhum vão comporta a duração toda: encurta para caber no vão mais próximo
  free.forEach(([a, b]) => {
    if (b - a >= MIN_DUR) {
      const len = Math.min(dur, b - a), s = clamp(Math.round(want / SNAP) * SNAP, a, b - len), d = Math.abs(s - want);
      if (d < cd) { cd = d; cand = { start: s, end: s + len }; }
    }
  });
  return cand;
}

// Inserção "com reação": o bloco entra onde foi solto e os blocos de baixo que ficariam sobrepostos
// são empurrados, colando no final do bloco novo (em cascata). Retorna { start, end, moves }.
function planInsert(key, raw, dur, ignoreId, shrink) {
  const fallback = () => { const r = placeBlock(key, raw, dur, ignoreId, shrink); return r ? { ...r, moves: {} } : null; };
  const list = otherEvents(key, ignoreId).sort((a, b) => a.start - b.start);
  const lo = MIN_T, hi = MAX_T - dur;
  if (hi < lo) return null;
  const want = clamp(raw, lo, hi);
  // 1) ímãs: bordas dos vizinhos, depois quartos de hora, senão passos de 5 min
  let s = null, bd = Infinity;
  const mags = [hi]; list.forEach(e => mags.push(e.end, e.start - dur));
  mags.forEach(v => { const d = Math.abs(v - want); if (v >= lo && v <= hi && d <= magnetMin() && d < bd) { bd = d; s = v; } });
  if (s == null) { const q = Math.round(want / QUARTER) * QUARTER; s = Math.abs(q - want) <= quarterMin() ? q : Math.round(want / SNAP) * SNAP; }
  s = clamp(s, lo, hi);
  // 2) topo caiu dentro de um bloco: entra antes dele (metade de cima) ou depois (metade de baixo)
  const inside = list.find(e => s > e.start && s < e.end);
  if (inside) s = s >= (inside.start + inside.end) / 2 ? inside.end : inside.start;
  if (s > hi) return fallback();
  // 3) cascata: quem ficaria sobreposto cola no fim do bloco anterior
  const moves = {}; let cursor = s + dur;
  for (const e of list) {
    if (e.start < s) continue;
    const len = e.end - e.start;
    if (e.start < cursor) { moves[e.id] = { start: cursor, end: cursor + len }; cursor += len; }
    else cursor = Math.max(cursor, e.end);
  }
  if (cursor > MAX_T) return fallback();      // não cabe empurrando: usa o espaço livre mais próximo
  return { start: s, end: s + dur, moves };
}
// mostra (sem salvar) os blocos que reagem; sem `moves`, devolve tudo para o lugar
function showMoves(moves, skipId) {
  const key = curKey();
  track.querySelectorAll('.ev').forEach(n => {
    if (n.dataset.id === skipId) return;
    const e = findEv(key, n.dataset.id); if (!e) return;
    const m = moves && moves[e.id];
    placeEv(n, e, m ? m.start : e.start, m ? m.end : e.end);
    n.classList.toggle('pushed', !!m);
  });
}
function applyMoves(key, moves) {
  dayEvents(key).forEach(e => { const m = moves && moves[e.id]; if (m) { e.start = m.start; e.end = m.end; } });
}

function addEventAt(key, tid, start, end) {
  const t = tpl(tid); if (!t) return;
  const id = uid();
  dayEvents(key).push({ id, tid, name: t.name, color: t.color, icon: t.icon, start, end, remindStart: !!t.remindStart, remindEnd: !!t.remindEnd });
  silenceDay(key);
  save(); renderHeader(); renderChips();
  if (key === curKey()) {
    renderGrid();
    const n = track.querySelector(`.ev[data-id="${id}"]`);
    if (n) { n.classList.add('pop'); setTimeout(() => n.classList.remove('pop'), 450); }
  }
}
function appendToDay(key, tid) {
  const t = tpl(tid); if (!t) return;
  const evs = dayEvents(key), dur = clamp(t.dur, MIN_DUR, MAX_T - MIN_T);
  const last = evs.length ? Math.max(...evs.map(e => e.end)) : 9*60;
  const res = placeBlock(key, last, dur, null, true);
  if (!res) { toast(say('noRoomDay')); return; }
  addEventAt(key, tid, res.start, res.end);
  if (key !== curKey()) toast(say('addedOn', { day: dayLabel(parseKey(key)) }));
}
function remSummary(e) {
  const p = [];
  if (e.remindStart) p.push(say('remWhenStart'));
  if (e.remindEnd) p.push(say('remBeforeEnd', { n: REMIND_BEFORE }));
  return p.length ? say('remNotifies', { list: p.join(say('remAnd')) }) : say('noRem');
}
function setRemind(id, field, val) {
  const e = findEv(curKey(), id); if (!e) return;
  e[field] = val;
  if (val) delete state.fired[`${curKey()}|${e.id}|${field === 'remindStart' ? 's|' + e.start : 'e|' + e.end}`];
  save(); renderGrid();
  if (val && 'Notification' in window && Notification.permission === 'default')
    toast(say('remOnToast'), { ms: 5000 });
}
// menu do sininho: escolher os avisos de um bloco
let rmenuEl = null, rmenuFor = null;
function closeRMenu() { if (rmenuEl) { rmenuEl.remove(); rmenuEl = null; rmenuFor = null; } }
function openRMenu(anchor, id) {
  if (rmenuEl && rmenuFor === id) { closeRMenu(); return; }
  closeRMenu();
  const e = findEv(curKey(), id); if (!e) return;
  const row = (label, field) => {
    const cb = el('input', { type: 'checkbox' }); cb.checked = !!e[field];
    cb.addEventListener('change', () => setRemind(id, field, cb.checked));
    return el('label', { class: 'check' }, cb, label);
  };
  rmenuEl = el('div', { class: 'rmenu', role: 'dialog', 'aria-label': say('bellAria') },

// Editar horário digitando: se o bloco crescer sobre os de baixo, eles são reajustados em cascata (colam no novo fim).
function planEdit(key, id, s, f) {
  const list = otherEvents(key, id).sort((a, b) => a.start - b.start);
  const above = list.find(x => x.start < s && x.end > s);
  if (above) return { error: say('errConflict', { name: above.name, s: fmt(above.start), f: fmt(above.end) }) };
  const moves = {}; let cursor = f;
  for (const x of list) {
    if (x.start < s) continue;
    const len = x.end - x.start;
    if (x.start < cursor) { moves[x.id] = { start: cursor, end: cursor + len }; cursor += len; }
    else cursor = Math.max(cursor, x.end);
  }
  if (cursor > MAX_T) return { error: say('errNoFit', { t: fmt(MAX_T) }) };
  return { moves };
}

};
twoStep($('#clearDay'), 'clearDay', () => { state.events[curKey()] = []; save(); renderHeader(); renderChips(); renderGrid(); });

/* ================= Backup ================= */
$('#exportBtn').onclick = () => {
  try {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = el('a', { href: URL.createObjectURL(blob), download: `meu-dia-backup-${keyOf(new Date())}.json` });
    document.body.append(a); a.click(); a.remove(); toast(say('backupExported'));
  } catch (e) { toast(say('exportFail')); }
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || !Array.isArray(data.templates) || typeof data.events !== 'object') throw 0;
    const keepLang = state.settings.lang;
    state = normalize(data);
    if (!(data.settings && LANGS.includes(data.settings.lang))) state.settings.lang = keepLang;   // backup antigo não traz idioma: mantém o atual
    save(); applyI18n(); renderAll(); buildAxis(); toast(say('backupImported'));
  } catch (err) { toast(say('invalidFile')); }
  e.target.value = '';
};

/* ================= Notifications & reminders ================= */
let actx = null;
function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.resume) actx.resume(); } catch (e) {} }
document.addEventListener('pointerdown', unlockAudio, { once: true });
function beep() {
  try {
    unlockAudio(); if (!actx) return;
    [0, 0.2, 0.4].forEach(d => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + d;
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + 0.2);
    });
  } catch (e) {}
}
function notify(title, body, color, tag) {
  reminderToast(title, body, color); beep();
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      const n = new Notification(title, { body, tag, requireInteraction: true });
      n.onclick = () => { window.focus(); n.close(); };
    }
  } catch (e) {}
}
$('#notifBtn').onclick = async () => {
  try { await Notification.requestPermission(); } catch (e) { toast(say('permFail')); }
  renderStatus();
};
$('#notifTest').onclick = () => notify(say('testTitle'), say('testBody'), '#6366F1', 'test');

// marca como "já avisado" os gatilhos que já passaram ao editar/criar blocos de hoje (evita aviso atrasado)
function silenceDay(key) {
  const now = new Date(); if (key !== keyOf(now)) return;
  const nm = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  (state.events[key] || []).forEach(e => {
    if (nm >= e.start) state.fired[`${key}|${e.id}|s|${e.start}`] = 1;
    if (nm >= Math.max(e.end - REMIND_BEFORE, e.start)) state.fired[`${key}|${e.id}|e|${e.end}`] = 1;
  });
}
function checkReminders() {
  const now = new Date(), dk = keyOf(now);
  const nm = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  (state.events[dk] || []).forEach(e => {
    if (e.remindStart) {                       // quando começa (tolerância de 2 min se a aba estava "dormindo")
      const id = `${dk}|${e.id}|s|${e.start}`;
      if (!state.fired[id] && nm >= e.start && nm < Math.min(e.start + 2, e.end)) {
        state.fired[id] = 1; save();
        notify(say('startsNow', { icon: e.icon || '⏰', name: e.name }), `${fmt(e.start)} – ${fmt(e.end)}`, e.color, id);
      }
    }
    if (e.remindEnd) {                         // 10 min antes de acabar
      const id = `${dk}|${e.id}|e|${e.end}`;
      if (!state.fired[id] && nm >= Math.max(e.end - REMIND_BEFORE, e.start) && nm < e.end) {
        state.fired[id] = 1; save();
        const mins = Math.max(1, Math.ceil(e.end - nm));
        notify(say('endsIn', { icon: e.icon || '⏰', name: e.name, n: mins }), say('endsAt', { e: fmt(e.end), s: fmt(e.start), f: fmt(e.end) }), e.color, id);
      }
    }
  });
}

/* ================= Init ================= */
function applyI18n() {
  const L = lang();
  document.documentElement.lang = LOCALE[L];
  document.title = say('pageTitle');
  document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = say(n.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach(n => { n.title = say(n.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-aria]').forEach(n => { n.setAttribute('aria-label', say(n.dataset.i18nAria)); });
  const cd = $('#clearDay'); if (cd) cd.classList.remove('armed');
  LANGS.forEach(l => { const b = $('#lang-' + l); if (b) { b.classList.toggle('on', l === L); b.setAttribute('aria-pressed', l === L ? 'true' : 'false'); } });
}
function setLang(l) {
  if (!LANGS.includes(l) || l === state.settings.lang) return;
  state.settings.lang = l; save();
  closeModal(); closeRMenu();
  applyI18n(); buildAxis(); renderAll(); updateZoomUI();
}
LANGS.forEach(l => { const b = $('#lang-' + l); if (b) b.onclick = () => setLang(l); });

applyI18n();
buildAxis();
renderAll();
sizePanel();
updateZoomUI();
fitGrid();
scrollToNow();
checkReminders();
setInterval(checkReminders, 5000);
setInterval(updateNow, 30000);
})();
</script>
</body>
